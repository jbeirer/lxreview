[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "lxreview"
version = "0.1.1"
description = "Independent AI review loops for LXPLUS development"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Joshua Beirer" }]
classifiers = ["Operating System :: POSIX :: Linux", "Operating System :: MacOS", "Programming Language :: Python :: 3"]
# Exact pins where behavior depends on the version: the ChatGPT driver (Playwright), the
# MCP protocol and the relay servers. An installed wheel does not use uv.lock.
dependencies = ["typer>=0.16,<1", "pydantic>=2.11,<3", "httpx>=0.28,<1", "rich>=14,<16", "mcp==2.2.0", "tomli-w>=1.2,<2", "psutil>=7,<8", "aiohttp==3.14.3", "playwright==1.63.0"]
[project.urls]
Homepage = "https://github.com/jbeirer/lxreview"
Issues = "https://github.com/jbeirer/lxreview/issues"
[project.scripts]
lxreview = "lxreview.cli:main"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "mypy>=1.16", "types-psutil"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires explicit opt-in and human browser login", "browser: needs a Chromium; opt in with LXREVIEW_BROWSER_TESTS=1", "forge: exercises the real PR/MR discussion fetch (with a fake gh or GitLab API)"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build]
exclude = ["**/CLAUDE.md", "**/CLAUDE.local.md", "**/.claude", "**/AGENTS.md", "**/LXReview-instructions.md", "**/.agents", "**/.codex", "docs/assets"]
