<!doctype html>
<!--
  A stand-in for chatgpt.com that reproduces only the markup LXReview relies on, as
  observed on 2026-09-26. Scenarios: ?scenario=logged-out|captcha|error|multi|mangle|stuck|frozen-slider|stuck-up
-->
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    main { max-width: 700px; margin: 0 auto; padding: 16px; }
    [data-chatgpt-composer] { display: flex; gap: 8px; margin-top: 24px; }
    .ProseMirror { flex: 1; min-height: 26px; border: 1px solid #999; padding: 4px; }
    .ProseMirror p { margin: 0; white-space: break-spaces; }
    .Mention { white-space: nowrap; color: #0a66c2; }
    .IconContainer { display: inline-block; }
    .IconContainer svg { display: flex; }
  </style>
</head>
<body>
  <header><button aria-label="Open profile menu" id="profile">J</button></header>
  <main>
    <div id="thread"></div>
    <form data-chatgpt-composer onsubmit="return false">
      <button type="button" aria-label="Add files and more">+</button>
      <div class="ProseMirror" contenteditable="true" aria-label="Ask ChatGPT" id="composer"></div>
      <button type="button" aria-label="Select ChatGPT model" id="picker" aria-haspopup="menu" aria-expanded="false" data-selected-reasoning-effort="medium">Thinking effort</button>
      <button type="button" aria-label="Send" id="send" disabled>Send</button>
    </form>
  </main>
  <script>
    const scenario = new URLSearchParams(location.search).get('scenario') || 'normal';
    const composer = document.getElementById('composer');
    const send = document.getElementById('send');
    const thread = document.getElementById('thread');
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    if (scenario === 'logged-out') {
      document.getElementById('profile').replaceWith(Object.assign(document.createElement('button'), { textContent: 'Log in' }));
    }
    if (scenario === 'captcha') {
      // Only the attribute matters; this URL is never fetched.
      document.body.append(Object.assign(document.createElement('iframe'), { src: 'about:blank#challenges.cloudflare.com' }));
    }

    // ChatGPT keeps the prompt in a paragraph and turns GitHub URLs into a rich link whose
    // icon is a non-editable ProseMirror widget; the rendered innerText then gains a line break.
    const richLink = (url) =>
      `<span rich-link-source-app-id="github" class="Mention" text-link-href="${url}" data-rich-text-generated-autolink="">` +
      '<span class="Label"><span data-inline-url-icon="" class="Mention ProseMirror-widget" aria-hidden="true" contenteditable="false">' +
      '<span class="IconContainer" contenteditable="false"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 2h16v16H2z"></path></svg></span>' +
      `</span>${url}</span></span>`;
    const escape = (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    // What ChatGPT would send: the document text, without editor widgets.
    const documentText = () => {
      const copy = composer.cloneNode(true);
      copy.querySelectorAll('.ProseMirror-widget').forEach((n) => n.remove());
      return copy.textContent;
    };

    composer.addEventListener('input', () => {
      if (scenario === 'mangle') composer.textContent = composer.textContent.toUpperCase();
      const text = documentText();
      if (text && !composer.querySelector('p')) {
        composer.innerHTML = '<p>' + escape(text).replace(/https:\/\/github\.com\/\S+/g, richLink) + '</p>';
      }
      send.disabled = scenario === 'stuck' || !text.trim();
    });

    // The model picker: a reasoning slider ("Power", arrow keys, status "Medium, 2 of 3.")
    // and, behind the "Select model" toggle, the models as menu radio items.
    const picker = document.getElementById('picker');
    const levels = [['Instant', 'none'], ['Medium', 'medium'], ['High', 'high']];
    const models = [['GPT-5.6 Sol', ''], ['GPT-5.5', 'Leaving on October 14']];
    // The level and model are account settings and survive a reload; the view the
    // picker opens on is remembered only within one page.
    let level = Number(sessionStorage.getItem('level') ?? 1);
    let model = Number(sessionStorage.getItem('model') ?? 0);
    let view = 'simple', menu = null;
    const save = () => { sessionStorage.setItem('level', level); sessionStorage.setItem('model', model); };
    const closeMenu = () => {
      if (menu) menu.remove();
      menu = null;
      picker.setAttribute('aria-expanded', 'false');
    };
    picker.setAttribute('data-selected-reasoning-effort', levels[level][1]);
    const openMenu = () => {
      menu = document.createElement('div');
      menu.setAttribute('data-radix-popper-content-wrapper', '');
      menu.innerHTML =
        '<div role="menu" data-state="open">' +
        '<div data-model-picker-view="' + view + '"><div data-view="simple">' +
        '<div role="menuitem" aria-label="Select model" data-model-picker-view-toggle="true" tabindex="0"><span></span> &rsaquo;</div>' +
        '<span id="effort-status" role="status" aria-live="polite"></span>' +
        '<span id="effort-help">Use Left and Right arrow keys to adjust power</span>' +
        '<div role="menuitem" aria-label="Power" data-reasoning-slider="true" tabindex="-1" aria-describedby="effort-status effort-help" aria-keyshortcuts="ArrowLeft ArrowRight">' +
        '<span role="slider" aria-valuemin="0" aria-valuemax="2" aria-hidden="true"></span></div></div>' +
        '<div data-view="advanced"></div></div></div>';
      document.body.append(menu);
      const advanced = menu.querySelector('[data-view=advanced]');
      const simple = menu.querySelector('[data-view=simple]');
      const show = () => {
        menu.querySelector('[data-model-picker-view]').setAttribute('data-model-picker-view', view);
        simple.hidden = view !== 'simple';
        advanced.hidden = view !== 'advanced';
      };
      models.forEach(([name, note], i) => {
        const item = document.createElement('div');
        item.setAttribute('role', 'menuitemradio');
        item.setAttribute('aria-checked', String(i === model));
        item.innerHTML = '<div><span>' + name + '</span>' + (note ? '<span>' + note + '</span>' : '') + '</div>';
        item.style.display = 'block';
        item.addEventListener('click', () => { model = i; save(); closeMenu(); });
        advanced.append(item);
      });
      const render = () => {
        menu.querySelector('[data-model-picker-view-toggle] span').textContent = levels[level][0];
        menu.querySelector('#effort-status').textContent = levels[level][0] + ', ' + (level + 1) + ' of 3.';
        menu.querySelector('[role=slider]').setAttribute('aria-valuenow', String(level));
        picker.setAttribute('data-selected-reasoning-effort', levels[level][1]);
      };
      render();
      show();
      menu.querySelector('[data-model-picker-view-toggle]').addEventListener('click', () => {
        view = 'advanced';
        show();
      });
      menu.querySelector('[data-reasoning-slider]').addEventListener('keydown', (event) => {
        if (scenario === 'frozen-slider') return;
        if (scenario === 'stuck-up' && event.key === 'ArrowRight') return;
        // ChatGPT updates the status a moment after the key press.
        const move = event.key === 'ArrowLeft' ? -1 : event.key === 'ArrowRight' ? 1 : 0;
        if (move) setTimeout(() => { level = Math.min(2, Math.max(0, level + move)); save(); if (menu) render(); }, 150);
      });
      picker.setAttribute('aria-expanded', 'true');
    };
    picker.addEventListener('click', () => (menu ? closeMenu() : openMenu()));
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeMenu(); });

    composer.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || event.shiftKey) return;
      event.preventDefault();
      if (!send.disabled) send.click();
    });

    const replyFor = (text) => {
      const exact = text.match(/^Reply exactly (\S+)$/);
      return exact ? exact[1] : 'You said: ' + text;
    };

    const block = (turn) => {
      const unit = document.createElement('div');
      const markdown = document.createElement('div');
      markdown.dataset.markdownTextStyle = 'assistant-message';
      unit.append(markdown);
      turn.append(unit);
      return markdown;
    };

    send.addEventListener('click', async () => {
      const text = documentText().trim();
      composer.textContent = '';
      send.disabled = true;
      send.hidden = true;
      const turn = document.createElement('div');
      turn.dataset.turnKey = 'turn-' + thread.children.length;
      const bubble = document.createElement('div');
      bubble.dataset.userMessageBubble = 'true';
      bubble.textContent = text;
      turn.append(bubble);
      thread.append(turn);
      await sleep(300);
      const words = replyFor(text).split(/(?= )/);
      const markdown = block(turn);
      for (const [i, word] of words.entries()) {
        markdown.textContent += word;
        await sleep(30);
        // Longer than the driver's stability window: text alone must not end the wait.
        if (i === Math.floor(words.length / 2)) await sleep(2500);
      }
      if (scenario === 'multi') block(turn).textContent = 'VERDICT: CLEAN';
      if (scenario === 'error') {
        turn.append(Object.assign(document.createElement('div'), { textContent: 'Something went wrong while generating the response.' }));
      } else {
        const actions = document.createElement('div');
        for (const label of ['Copy', 'Read aloud', 'Regenerate response']) {
          const button = Object.assign(document.createElement('button'), { textContent: label[0] });
          button.setAttribute('aria-label', label);
          actions.append(button);
        }
        turn.append(actions);
      }
      send.hidden = false;
    });
  </script>
</body>
</html>
