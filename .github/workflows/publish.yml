name: publish
# Publishes a release to PyPI when a version tag such as v0.1.0 is pushed, after the full CI
# suite (every platform and Python version, plus the browser fixture job) passes on that tag,
# then creates the matching GitHub release.
# PyPI trusts this workflow through trusted publishing, so no API token is stored.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'
          python-version: '3.12'
          # Nothing is installed here, so there is no cache to save.
          enable-cache: false
      - name: Tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv build
      - name: Wheel installs as a uv tool
        run: |
          UV_TOOL_DIR=/tmp/tools UV_TOOL_BIN_DIR=/tmp/tools/bin uv tool install --managed-python dist/*.whl
          /tmp/tools/bin/lxreview version
      - run: uv publish --trusted-publishing always
      - name: GitHub release with generated notes and the published files
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
