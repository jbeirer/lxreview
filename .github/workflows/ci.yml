name: quality
on:
  push:
    # Release tags run this workflow through publish.yml, which waits for it.
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - name: Wheel installs as a uv tool
        run: |
          export UV_TOOL_DIR=/tmp/lxreview-tools UV_TOOL_BIN_DIR=/tmp/lxreview-tools/bin
          uv tool install --python '${{ matrix.python }}' dist/*.whl
          /tmp/lxreview-tools/bin/lxreview version
          /tmp/lxreview-tools/bin/lxreview --help
  browser:
    # Drives the real Playwright session against a local page that mirrors ChatGPT's markup.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
        env:
          LXREVIEW_BROWSER_TESTS: '1'
